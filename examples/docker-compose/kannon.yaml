debug: true
nats_url: env://KANNON_NATS_URL:-nats://nats:4222
database_url: env://KANNON_DATABASE_URL:-postgresql://postgres:example@db:5432/postgres?sslmode=disable

# Which components this process runs. Every one of them is off unless enabled, and
# `enabled` takes a reference like any other value — which is how one file can serve
# a whole installation, each deployment turning on its own component. Here they are
# all on, because this example is a single container.
services:
  api:
    enabled: true
  smtp:
    enabled: true
  sender:
    enabled: true
  dispatcher:
    enabled: true
  validator:
    enabled: true
  tracker:
    enabled: true
  stats:
    enabled: true
  # The writer of the audit trail. Off, together with audit.enabled below.
  audit:
    enabled: env://KANNON_ENABLE_AUDIT:-false

api:
  port: 50051
  # Authenticates the Admin API and both Stats APIs, and authorizes everything on every
  # Domain. Required whenever services.api.enabled is set: without it Kannon refuses to boot.
  # Outside a local example, write `admin_token: env://KANNON_ADMIN_TOKEN` and keep the value
  # in a secret rather than in this file.
  admin_token: env://KANNON_ADMIN_TOKEN:-change-me

# Signs every bounce return path, so the inbound SMTP server can tell a DSN about a message
# Kannon sent from one anybody could forge to cancel a Delivery. Required by the dispatcher and
# the smtp server, which must share it; at least 32 characters. The fallback exists only so this
# example starts: outside it, write `secret: env://KANNON_BOUNCE_SECRET` and keep a random value
# (`openssl rand -hex 32`) in a secret.
bounce:
  secret: env://KANNON_BOUNCE_SECRET:-local-example-bounce-secret-change-me

sender:
  hostname: kannon.ludusrusso.dev
  max_jobs: 100
  demo_sender: true

# The audit trail is off, as it is everywhere by default: an Audit Record can hold the person
# an X-Kannon-Attribution header named, and nothing should start retaining that because an
# example was copied. This is the feature — whether decisions are published at all — and
# services.audit above is the writer that turns them into rows; both are needed. Pick a
# retention you are willing to defend: 720h is a month.
audit:
  enabled: env://KANNON_ENABLE_AUDIT:-false
  retention: 720h
