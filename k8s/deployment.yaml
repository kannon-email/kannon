apiVersion: v1
kind: ConfigMap
metadata:
  name: kannon-config
data:
  # One file for the whole installation. Every setting lives here, and anything
  # that differs between deployments — which components a pod runs, the database
  # it connects to, the admin credential — is a reference to an environment
  # variable rather than a value: `env://NAME` is required and refuses the boot
  # when unset, `env://NAME:-default` falls back.
  #
  # That is what lets a Deployment per component share this ConfigMap and differ
  # only in the KANNON_ENABLE_* variables it sets. This example runs every
  # component in one pod, so it enables them all with a default of true.
  config.yaml: |
    database_url: env://KANNON_DATABASE_URL
    nats_url: env://KANNON_NATS_URL:-nats://nats:4222
    debug: env://KANNON_DEBUG:-false

    services:
      api:
        enabled: env://KANNON_ENABLE_API:-true
      smtp:
        enabled: env://KANNON_ENABLE_SMTP:-true
      sender:
        enabled: env://KANNON_ENABLE_SENDER:-true
      dispatcher:
        enabled: env://KANNON_ENABLE_DISPATCHER:-true
      validator:
        enabled: env://KANNON_ENABLE_VALIDATOR:-true
      tracker:
        enabled: env://KANNON_ENABLE_TRACKER:-true
      stats:
        enabled: env://KANNON_ENABLE_STATS:-true
      # The writer of the authorization register. On its own it collects nothing:
      # the decisions are published only when `audit.enabled` is set, so this and
      # that key are two halves of one switch. Both are off by default because an
      # Audit Record holds personal data, and its retention (`audit.retention`,
      # one month unless stated) is the operator's obligation rather than
      # Kannon's preference.
      audit:
        enabled: env://KANNON_ENABLE_AUDIT:-false

    api:
      port: 50051
      # Authenticates the Admin API and both Stats APIs, and authorizes
      # everything on every Domain. Referenced rather than written here so the
      # value stays in a Secret; the pod refuses to boot without it whenever it
      # serves the API.
      admin_token: env://KANNON_ADMIN_TOKEN

    sender:
      hostname: env://KANNON_SENDER_HOSTNAME

    audit:
      enabled: env://KANNON_ENABLE_AUDIT:-false
      retention: env://KANNON_AUDIT_RETENTION:-720h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kannon
  labels:
    name: kannon
spec:
  selector:
    matchLabels:
      name: kannon
  template:
    metadata:
      labels:
        name: kannon
    spec:
      containers:
        - name: kannon-cp
          image: ghcr.io/kannon-email/kannon/kannon
          imagePullPolicy: Always
          args: ['--config', '/etc/kannon/config.yaml']
          env:
            - name: KANNON_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kannon-database
                  key: url
            - name: KANNON_SENDER_HOSTNAME
              value: kannon.example.com
            - name: KANNON_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kannon-admin-token
                  key: token
          resources:
            limits:
              memory: '64Mi'
              cpu: '1'
            requests:
              cpu: '50m'
          ports:
            - containerPort: 50051
              name: 'api'
            - containerPort: 8080
              name: 'tracker'
            # The image runs as UID 1000, so binding 25 needs either
            # CAP_NET_BIND_SERVICE, the net.ipv4.ip_unprivileged_port_start
            # sysctl, or a high `smtp.address` behind this Service port.
            - containerPort: 25
              name: 'smtp'
          volumeMounts:
            - name: config
              mountPath: /etc/kannon
              readOnly: true
      volumes:
        # Kannon exits at boot when --config points at a file that is not there,
        # and a process with no component enabled is refused rather than left to
        # exit as if it had done its job.
        - name: config
          configMap:
            name: kannon-config
---
apiVersion: v1
kind: Service
metadata:
  name: kannon
spec:
  type: ClusterIP
  selector:
    name: kannon
  ports:
    - port: 50051
      targetPort: api
      name: api
    - port: 8080
      targetPort: tracker
      name: tracker
    - port: 25
      targetPort: smtp
      name: smtp
