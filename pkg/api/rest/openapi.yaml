          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
          tracking_mode:
            type: string
            enum:
            - pseudonymous
            - identified
            - full
          tracking_identity:
            type: string
        required:
        - id
        - domain
        - batch_id
        - timestamp
        - type
        - data
        - tracking_mode
        allOf:
        - if:
            properties:
              tracking_mode:
                const: pseudonymous
          then:
            not:
              anyOf:
              - required:
                - email
              - required:
                - delivery_id
            required:
            - tracking_identity
        - if:
            properties:
              tracking_mode:
                enum:
                - pseudonymous
                - identified
          then:
            properties:
              data:
                not:
                  anyOf:
                  - required:
                    - ip
                  - required:
                    - user_agent
      discriminator:
        propertyName: type
      description: Engagement identity fields follow Tracking Policy. Anonymous events exist only as counters. Pseudonymous
        events must not expose email or original delivery_id. Transient worker errors are not public outcome events.
        Original identifiers may outlive Batch/Delivery history; these historical references do not guarantee the
        resource remains retrievable.
    AggregateSeries:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        group_by:
          type: string
        buckets:
          type: array
          items:
            type: object
            properties:
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              counts:
                type: object
                properties:
                  validated:
                    type: integer
                    minimum: 0
                  rejected:
                    type: integer
                    minimum: 0
                  delivered:
                    type: integer
                    minimum: 0
                  bounced:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  opened:
                    type: integer
                    minimum: 0
                  clicked:
                    type: integer
                    minimum: 0
                required:
                - validated
                - rejected
                - delivered
                - bounced
                - failed
                - opened
                - clicked
            required:
            - start
            - end
            - counts
          maxItems: 1000
      description: Domain-level event occurrence counters, not unique-recipient counts; no batch_id filter. Includes
        zero-filled empty buckets. Maximum 1000 complete buckets; split the range or increase group_by. A zero does
        not prove collection was operational.
      required:
      - from
      - to
      - group_by
      - buckets
    DomainPage:
