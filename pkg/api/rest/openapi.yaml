          batch_id: &id036
            $ref: '#/components/schemas/ID'
          timestamp: &id037
            type: string
            format: date-time
          type:
            type: string
            enum:
            - validated
          data:
            type: object
            properties: {}
          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
        required:
        - id
        - domain
        - batch_id
        - timestamp
        - type
        - data
      - type: object
        properties:
          id: *id034
          domain: *id035
          batch_id: *id036
          timestamp: *id037
          type:
            type: string
            enum:
            - rejected
          data:
            type: object
            properties:
              reason:
                type: string
          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
        required:
        - id
        - domain
        - batch_id
        - timestamp
        - type
        - data
      - type: object
        properties:
          id: *id034
          domain: *id035
          batch_id: *id036
          timestamp: *id037
          type:
            type: string
            enum:
            - delivered
          data:
            type: object
            properties: {}
          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
        required:
        - id
        - domain
        - batch_id
        - timestamp
        - type
        - data
      - type: object
        properties:
          id: *id034
          domain: *id035
          batch_id: *id036
          timestamp: *id037
          type:
            type: string
            enum:
            - bounced
          data:
            type: object
            properties:
              smtp_code:
                type: integer
                minimum: 0
              detail:
                type: string
              permanent:
                type: boolean
                description: Permanent SMTP refusal versus retry exhaustion after transient refusals; both are terminal
                  bounced outcomes.
          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
        required:
        - id
        - domain
        - batch_id
        - timestamp
        - type
        - data
      - type: object
        properties:
          id: *id034
          domain: *id035
          batch_id: *id036
          timestamp: *id037
          type:
            type: string
            enum:
            - failed
          data:
            type: object
            properties:
              reason:
                type: string
          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
        required:
        - id
        - domain
        - batch_id
        - timestamp
        - type
        - data
      - type: object
        properties:
          id: *id034
          domain: *id035
          batch_id: *id036
          timestamp: *id037
          type:
            type: string
            enum:
            - opened
          data:
            type: object
            properties:
              ip:
                type: string
              user_agent:
                type: string
          email:
            type: string
          delivery_id:
            $ref: '#/components/schemas/ID'
          tracking_mode:
