x-credential-storage: Retain the existing api_keys table and rows. No key replacement, reissuance, copying or backfill.
  Add role metadata in place; absent legacy metadata means sender on the existing Domain.
x-compatibility: Compatible evolution within v1beta1. Breaking changes require a new version. Legacy gRPC receives
  necessary fixes with no removal date fixed.
x-time-format: RFC 3339 input with explicit timezone; UTC output. Fractional-second precision is not fixed.
x-error-codes:
  malformed_request: 400
  unknown_query_parameter: 400
  invalid_query_parameter: 400
  invalid_cursor: 400
  invalid_attribution: 400
  unauthenticated: 401
  forbidden: 403
  not_found: 404
  domain_already_exists: 409
  idempotency_conflict: 409
  idempotency_in_progress: 409
  request_body_too_large: 413
  validation_failed: 422
  no_recipients_accepted: 422
  too_many_recipients: 422
  duplicate_attachment_filename: 422
  scheduled_at_not_future: 422
  expiry_not_future: 422
  rate_limited: 429
  internal_error: 500
  service_unavailable: 503
x-recipient-rejection-codes:
- invalid_email
- duplicate_recipient
- tracking_above_ceiling
- unsupported_tracking_mode
- unsubscribe_url_unresolved
- unresolved_placeholder
- reserved_field
x-implementation-constraints:
- Reuse existing application modules; add Batch creation where missing. REST adapter -> application operation ->
  persistence.
- Generated OpenAPI types stay out of domain/application interfaces. No command bus, per-endpoint factories or redundant
  pass-through layers.
- Simple persistent Delivery history with query-based Batch state counts initially; no event sourcing or generic
  projection framework. Preserve existing Stats pipeline.
- Batch-specific transactional idempotency with unique constraint and minimal receipt; no generic response cache.
- Fixed-order keyset cursors; no persisted pagination sessions or distributed snapshots.
