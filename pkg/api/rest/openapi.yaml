        domain: *id027
        batch_id: *id028
        email: *id029
        status: *id030
        created_at: *id031
        scheduled_at: *id032
        updated_at: *id033
        tracking:
          $ref: '#/components/schemas/TrackingPolicy'
        attempt_count:
