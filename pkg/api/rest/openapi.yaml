      - status
      - created_at
      - scheduled_at
      - completed_at
      - expires_at
      - accepted_count
      - rejected_count
      - delivery_counts
      - rejected_recipients
    DeliverySummary:
      type: object
      properties:
        id: &id026
          $ref: '#/components/schemas/ID'
        domain: &id027
          $ref: '#/components/schemas/DomainName'
        batch_id: &id028
          $ref: '#/components/schemas/ID'
        email: &id029
          type: string
        status: &id030
          $ref: '#/components/schemas/DeliveryStatus'
        created_at: &id031
          type: string
          format: date-time
        scheduled_at: &id032
          type: string
          format: date-time
        updated_at: &id033
          type: string
          format: date-time
      required:
      - id
