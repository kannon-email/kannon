      - from
      - subject
      - status
      - created_at
      - scheduled_at
      - completed_at
      - expires_at
      - accepted_count
      - rejected_count
      - delivery_counts
      - content
      - tracking
      - attachments
      description: ' History expires 30 days after Batch processing completion. GET then returns 404; Stats may
