    BatchCreated:
      type: object
      properties:
        id: *id014
        domain: *id015
        from: *id016
        subject: *id017
        status: *id018
        created_at: *id019
        scheduled_at: *id020
        completed_at: *id021
        expires_at: *id022
        accepted_count: *id023
        rejected_count: *id024
        delivery_counts: *id025
        rejected_recipients:
