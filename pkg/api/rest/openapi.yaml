      - sending
      - delivered
      - rejected
      - bounced
      - failed
    BatchSummary:
      type: object
      properties:
        id: &id014
          $ref: '#/components/schemas/ID'
        domain: &id015
          $ref: '#/components/schemas/DomainName'
        from: &id016
          $ref: '#/components/schemas/From'
        subject: &id017
          type: string
        status: &id018
          type: string
          enum:
          - pending
          - processing
          - completed
        created_at: &id019
          type: string
          format: date-time
        scheduled_at: &id020
          type: string
          format: date-time
        completed_at: &id021
          type:
          - string
          - 'null'
          format: date-time
        expires_at: &id022
          type:
          - string
          - 'null'
          format: date-time
        accepted_count: &id023
          type: integer
          minimum: 1
        rejected_count: &id024
          type: integer
          minimum: 0
        delivery_counts: &id025
