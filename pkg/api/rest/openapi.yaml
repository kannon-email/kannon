        scheduled:
          type: integer
          minimum: 0
        sending:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        bounced:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
      required:
      - pending
