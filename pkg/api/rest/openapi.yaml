      - domain
      - from
      - subject
      - status
      - created_at
      - scheduled_at
      - completed_at
      - expires_at
      - accepted_count
      - rejected_count
      - delivery_counts
    Batch:
      type: object
      properties:
        id: *id014
        domain: *id015
        from: *id016
        subject: *id017
        status: *id018
        created_at: *id019
        scheduled_at: *id020
        completed_at: *id021
        expires_at: *id022
        accepted_count: *id023
        rejected_count: *id024
        delivery_counts: *id025
        content:
          type: object
          properties:
            type:
              type: string
              enum:
              - html
            html:
              type: string
            source_template_id:
              type:
              - string
              - 'null'
          description: Immutable content snapshot. Source reference is provenance, not a live Template dependency.
          required:
          - type
          - html
        tracking:
          $ref: '#/components/schemas/TrackingPolicy'
        one_click_unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
        attachments:
