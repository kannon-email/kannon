openapi: 3.1.1
info:
  title: Kannon REST API
  version: v1beta1
  description: APPROVED DESIGN CONTRACT; NOT YET IMPLEMENTED. Accepted in Q46. Decisions are recorded in docs/rest-api-design.md.
    REST adapters own generated wire types; domain/application interfaces own independent types. Existing API Keys
    remain in api_keys without data migration or reissuance.
servers:
- url: /v1beta1
security:
- bearerAuth: []
tags:
- name: Domains
- name: Templates
- name: API keys
- name: Batches
- name: Deliveries
- name: Stats
- name: Health
x-design-review:
  status: accepted
  unresolved: []
  implementation_follow_up:
  - Go generator selection and enforcement of domain/transport import separation.
  - Application operations, storage support and contract tests; preserve existing api_keys rows and secrets.
  - Documentation/spec hosting.
  acceptance: User confirmed Q46 and subsequently approved the five-role simplification and lean implementation
    constraints. Implementation remains a separate task.
paths:
  /domains:
    post:
      operationId: createDomain
      tags:
      - Domains
      summary: Create a Domain
      parameters:
      - $ref: '#/components/parameters/attribution'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin@root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreate'
    get:
      operationId: listDomains
      tags:
      - Domains
      summary: List Domains
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin@root
      description: ' Ordering: Domain name ascending.'
  /domains/{domain}:
    get:
      operationId: getDomain
      tags:
      - Domains
      summary: Read a Domain
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
    patch:
      operationId: updateDomain
      tags:
      - Domains
      summary: Replace the Domain Tracking Policy
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainPatch'
  /domains/{domain}/templates:
    post:
      operationId: createTemplate
      tags:
      - Templates
      summary: Create a Persistent Template
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/attribution'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
    get:
      operationId: listTemplates
      tags:
      - Templates
      summary: List Persistent Templates
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateSummaryPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      description: ' Ordering: Template ID ascending.'
  /domains/{domain}/templates/{template_id}:
    get:
      operationId: getTemplate
      tags:
      - Templates
      summary: Read a Template
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/template_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
    patch:
      operationId: updateTemplate
      tags:
      - Templates
      summary: Update title and/or HTML
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/template_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePatch'
    delete:
      operationId: deleteTemplate
      tags:
      - Templates
      summary: Delete a Template without affecting accepted Batches
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/template_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '204':
          description: Success.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
  /domains/{domain}/api-keys:
    post:
      operationId: createAPIKey
      tags:
      - API keys
      summary: Issue a Domain credential
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/attribution'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      description: Requires admin authority on the path Domain. Issue only supported roles anchored to that Domain.
        Existing API Keys remain in api_keys; no limited-role credential issuance or generic delegation engine is
        introduced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
    get:
      operationId: listAPIKeys
      tags:
      - API keys
      summary: List credentials without secrets
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      description: ' Ordering: created_at descending, then ID descending.'
  /domains/{domain}/api-keys/{key_id}:
    get:
      operationId: getAPIKey
      tags:
      - API keys
      summary: Read credential metadata
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/key_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
    patch:
      operationId: revokeAPIKey
      tags:
      - API keys
      summary: Permanently revoke a credential
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/key_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      description: Idempotent revocation; roles cannot change and revoked credentials cannot be reactivated. Maps
        to domain delete authority even though the HTTP method is PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRevoke'
  /domains/{domain}/batches:
    post:
      operationId: createBatch
      tags:
      - Batches
      summary: Create an immutable Batch and accepted Deliveries atomically
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/idempotency'
      - $ref: '#/components/parameters/attribution'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreated'
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '200':
          description: Idempotent replay. No second Batch or Delivery is created. Original inline rejection details
            are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReplay'
      x-required-roles:
      - admin
      - sender
      description: At least one Recipient must be accepted. Persists accepted Deliveries atomically before 201.
        Submission success does not imply SMTP delivery. Rejected rows appear with original indexes. Max 2000 Recipients,
        10 MiB HTTP body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreate'
    get:
      operationId: listBatches
      tags:
      - Batches
      summary: List Batch summaries
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummaryPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      - batch-reader
      description: ' Ordering: created_at descending, then ID descending.'
  /domains/{domain}/batches/{batch_id}:
    get:
      operationId: getBatch
      tags:
      - Batches
      summary: Read a Batch and its immutable content
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/batch_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      - batch-reader
  /domains/{domain}/batches/{batch_id}/deliveries:
    get:
      operationId: listDeliveries
      tags:
      - Deliveries
      summary: List Delivery history
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/batch_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/delivery_status'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverySummaryPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      - batch-reader
      description: ' Ordering: Delivery ID ascending.'
  /domains/{domain}/batches/{batch_id}/deliveries/{delivery_id}:
    get:
      operationId: getDelivery
      tags:
      - Deliveries
      summary: Read one Delivery
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/batch_id'
      - $ref: '#/components/parameters/delivery_id'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      - batch-reader
  /domains/{domain}/stats/events:
    get:
      operationId: listStatsEvents
      tags:
      - Stats
      summary: Query retained individual events
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/event_batch_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsEventPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      - analyst
      description: ' Ordering: timestamp descending, then ID descending.'
  /domains/{domain}/stats/aggregated:
    get:
      operationId: getAggregatedStats
      tags:
      - Stats
      summary: Read Domain aggregate counters
      parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/group_by'
      - $ref: '#/components/parameters/attribution'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateSeries'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-required-roles:
      - admin
      - analyst
      - metrics-reader
      description: ' Ordering: Bucket start ascending.'
  /health:
    get:
      operationId: getHealth
      tags:
      - Health
      summary: Check readiness
      security: []
      responses:
        '200':
          description: Checks passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error503'
      description: Public, minimal readiness check. Failure must not disclose database or infrastructure error detail.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Configured Admin Token or Domain API Key. Authentication resolves a Principal; role checks happen
        in application operations.
  parameters:
    domain:
      name: domain
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DomainName'
    template_id:
      name: template_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    key_id:
      name: key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    batch_id:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    delivery_id:
      name: delivery_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Opaque cursor bound to Domain, collection and filters. Using it with a different query or an
        invalid token produces 400. No snapshot guarantee while data changes; do not edit the cursor.
    from:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive start.
    to:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive end.
    type:
      name: type
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventType'
        minItems: 1
        uniqueItems: true
      style: form
      explode: true
    event_batch_id:
      name: batch_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ID'
    group_by:
      name: group_by
      in: query
      required: true
      schema:
        type: string
      examples:
        hour:
          value: 1h
        day:
          value: 24h
      description: 'Go duration syntax. Whole-hour multiples >= 1h. Buckets start at from; from aligns to a UTC
        hour and to-from is a multiple of group_by. Examples: 1h, 6h, 24h, 168h. Runtime validation required. Maximum
        1000 buckets per query; empty buckets are returned with zeros.'
    idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Domain-scoped creation key. Successful creation prevents duplicate Batch creation for at least
        24 hours and retains the same Batch identity and original intake counts. Inline rejection details are never
        persisted or replayed. Changed input conflicts. Rejection before creation leaves the key reusable; an in-progress
        creation returns 409; every replay is reauthorized. After expiry, key reuse may create a new Batch.
    attribution:
      name: X-Kannon-Attribution
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
        description: Application validation additionally enforces 256 UTF-8 bytes, not just characters.
      description: Optional audit claim, not authority. Requires attribute on the target resource; admin holds it,
        other accepted roles do not. Valid UTF-8, at most 256 bytes, no control characters, trimmed non-empty value;
        an empty header means absent. Authenticated credential identity is always retained.
    delivery_status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DeliveryStatus'
      description: Filter persisted Deliveries by current state. rejected means post-intake validation rejection;
        inline rejections are never persisted.
  schemas:
    ID:
      type: string
      minLength: 1
      description: Opaque identifier. Clients must not parse its structure.
    DomainName:
      type: string
      minLength: 1
      description: Canonical lower-case sending Domain name.
    Fields:
      type: object
      additionalProperties:
        type: string
      description: String personalization values interpreted literally. Global values are defaults overridden by
        per-recipient fields. email is reserved for the actual recipient address and cannot be supplied as an override.
    Role:
      type: string
      enum:
      - admin
      - sender
      - batch-reader
      - analyst
      - metrics-reader
    TrackingMode:
      type: string
      enum:
      - 'off'
      - anonymous
      - pseudonymous
      - identified
      - full
    TrackingPolicy:
      type: object
      properties:
        opens:
          $ref: '#/components/schemas/TrackingMode'
        links:
          $ref: '#/components/schemas/TrackingMode'
      required:
      - opens
      - links
    TrackingOverride:
      type: object
      properties:
        opens:
          $ref: '#/components/schemas/TrackingMode'
        links:
          $ref: '#/components/schemas/TrackingMode'
      description: Omitted axes impose no additional restriction. A Batch request above the Domain ceiling fails.
      additionalProperties: false
    RecipientTracking:
      type: object
      properties:
        opens:
          type: string
        links:
          type: string
      description: Values use TrackingMode names. Unsupported modes or modes above the Domain ceiling reject this
        Recipient, not the entire Batch.
      additionalProperties: false
    From:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
      required:
      - email
      additionalProperties: false
    Unsubscribe:
      type: object
      properties:
        url_template:
          type: string
          minLength: 1
      description: Sender-owned HTTPS endpoint template, personalized with recipient fields. Not a Kannon endpoint.
      required:
      - url_template
      additionalProperties: false
    Headers:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
      description: Display headers only; recipients defines actual delivery targets.
      additionalProperties: false
    AttachmentInput:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
        content_base64:
          type: string
          contentEncoding: base64
      required:
      - filename
      - content_base64
      additionalProperties: false
      description: Filenames must be unique within the request. An exact duplicate fails the whole request with
        422 duplicate_attachment_filename; no attachment is silently overwritten.
    AttachmentMetadata:
      type: object
      properties:
        filename:
          type: string
        size_bytes:
          type: integer
          minimum: 0
      required:
      - filename
      - size_bytes
    RecipientInput:
      type: object
      properties:
        email:
          type: string
        fields:
          $ref: '#/components/schemas/Fields'
        tracking:
          $ref: '#/components/schemas/RecipientTracking'
      description: Input only. Missing/invalid address, unsupported policy, reserved-field override or unresolved
        personalization reject this Recipient inline. No rejected recipient data is persisted. Trim outer whitespace
        and lowercase only the email domain for duplicate comparison; preserve local-part case, dots and plus-tags.
        Later duplicate rows are rejected by original index.
      additionalProperties: false
    ContentInput:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - html
          html:
            type: string
            minLength: 1
        required:
        - type
        - html
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            enum:
            - template
          template_id:
            $ref: '#/components/schemas/ID'
        required:
        - type
        - template_id
        additionalProperties: false
      discriminator:
        propertyName: type
    BatchCreate:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/From'
        subject:
          type: string
        content:
          $ref: '#/components/schemas/ContentInput'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/RecipientInput'
          minItems: 1
          maxItems: 2000
        scheduled_at:
          type: string
          format: date-time
          description: Omit for immediate sending. If supplied, must be in the future at first creation; otherwise
            422. A valid replay does not revalidate the timestamp against the current clock.
        global_fields:
          $ref: '#/components/schemas/Fields'
          description: Defaults merged with each recipient fields, which take precedence. Applied to both subject
            and HTML. email is reserved. Missing placeholders reject the affected Recipient inline.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'
        headers:
          $ref: '#/components/schemas/Headers'
        tracking:
          $ref: '#/components/schemas/TrackingOverride'
        one_click_unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
      description: Maximum HTTP body 10 MiB including base64. Scheduling, tracking and personalization follow the
        documented domain rules.
      required:
      - from
      - subject
      - content
      - recipients
      additionalProperties: false
    FieldError:
      type: object
      properties:
        code:
          type: string
        pointer:
          type: string
        detail:
          type: string
      required:
      - code
      - pointer
      - detail
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: 'Stable identifier: urn:kannon:problem:<code>. Does not require a hosted documentation endpoint.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: RFC 9457. Stable type identifier urn:kannon:problem:<code>. Codes are stable; title/detail are
        human-readable. Extension fields may be added.
      required:
      - type
      - title
      - status
      - code
      - request_id
    RecipientRejection:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
        email:
          type: string
        code:
          type: string
        pointer:
          type: string
        detail:
          type: string
      description: 'Zero-based input index. Initial response only: no Delivery or rejection record is persisted
        for this row.'
      required:
      - index
      - code
      - pointer
      - detail
    Domain:
      type: object
      properties:
        domain:
          $ref: '#/components/schemas/DomainName'
        dkim_public_key:
          type: string
        tracking:
          $ref: '#/components/schemas/TrackingPolicy'
      required:
      - domain
      - dkim_public_key
      - tracking
      description: The Domain name is its identifier; there is no separate generated Domain ID.
    DomainCreate:
      type: object
      properties:
        domain:
          $ref: '#/components/schemas/DomainName'
      required:
      - domain
      additionalProperties: false
    DomainPatch:
      type: object
      properties:
        tracking:
          $ref: '#/components/schemas/TrackingPolicy'
      description: Replaces the full policy; the Domain name is immutable.
      required:
      - tracking
      additionalProperties: false
    TemplateSummary:
      type: object
      properties:
        id: &id001
          $ref: '#/components/schemas/ID'
        domain: &id002
          $ref: '#/components/schemas/DomainName'
        title: &id003
          type: string
        lifetime: &id004
          type: string
          enum:
          - persistent
          - transient
      required:
      - id
      - domain
      - title
      - lifetime
    Template:
      type: object
      properties:
        id: *id001
        domain: *id002
        title: *id003
        lifetime: *id004
        html:
          type: string
      required:
      - id
      - domain
      - title
      - lifetime
      - html
    TemplateCreate:
      type: object
      properties:
        title:
          type: string
        html:
          type: string
          minLength: 1
      required:
      - title
      - html
      additionalProperties: false
    TemplatePatch:
      type: object
      properties:
        title:
          type: string
        html:
          type: string
          minLength: 1
      minProperties: 1
      description: Omitted fields stay unchanged. Null is not an instruction to delete a field.
      additionalProperties: false
    APIKey:
      type: object
      properties:
        id: &id005
          $ref: '#/components/schemas/ID'
        domain: &id006
          $ref: '#/components/schemas/DomainName'
        name: &id007
          type: string
        prefix: &id008
          type: string
        roles: &id009
          type: array
          items:
            $ref: '#/components/schemas/Role'
          minItems: 1
          uniqueItems: true
        status: &id010
          type: string
          enum:
          - active
          - expired
          - revoked
        created_at: &id011
          type: string
          format: date-time
        expires_at: &id012
          type:
          - string
          - 'null'
          format: date-time
        revoked_at: &id013
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - domain
      - name
      - prefix
      - roles
      - status
      - created_at
      - expires_at
      - revoked_at
      description: Metadata from the existing api_keys table. Secret is never returned on reads. Legacy rows without
        role metadata expose sender. expires_at null means no automatic expiry.
      not:
        required:
        - secret
    APIKeyCreated:
      type: object
      properties:
        id: *id005
        domain: *id006
        name: *id007
        prefix: *id008
        roles: *id009
        status: *id010
        created_at: *id011
        expires_at: *id012
        revoked_at: *id013
        secret:
          type: string
      description: Secret is returned once on creation only.
      required:
      - id
      - domain
      - name
      - prefix
      - roles
      - status
      - created_at
      - expires_at
      - revoked_at
      - secret
    APIKeyCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          minItems: 1
          uniqueItems: true
        expires_at:
          type: string
          format: date-time
          description: Optional. Omit for no automatic expiration. If present, must be in the future.
      description: Issue in the existing api_keys table. Roles are immutable and anchored to the path Domain; requested
        authority cannot exceed issuer authority. Legacy keys without role metadata remain sender-only and retain
        their secrets and identifiers.
      required:
      - name
      - roles
      additionalProperties: false
    APIKeyRevoke:
      type: object
      properties:
        status:
          type: string
          enum:
          - revoked
      required:
      - status
      additionalProperties: false
    DeliveryStatus:
      type: string
