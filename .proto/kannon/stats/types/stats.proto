syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "kannon/tracking/types/tracking.proto";

package pkg.kannon.stats.types;

option go_package = "github.com/kannon-email/kannon/proto/kannon/stats/types";

message StatsAggregated {
  string type = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 count = 3;
}

message Stats {
  string message_id = 1;
  string domain = 2;
  string email = 3;
  google.protobuf.Timestamp timestamp = 4;
  string type = 5;
  StatsData data = 6;
  // The Tracking Mode that governed the engagement channel this event came
  // from, so a consumer can tell an event with no ip / user_agent because the
  // Mode forbade retaining them from one that merely lacks them. Only
  // engagement events (opened, clicked) state a Mode; every other outcome
  // leaves it unspecified.
  pkg.kannon.tracking.types.TrackingMode tracking_mode = 7;
}

message StatsData {
  oneof data {
    StatsDataAccepted accepted = 1;
    StatsDataDelivered delivered = 2;
    StatsDataFailed failed = 3;
    StatsDataBounced bounced = 4;
    StatsDataOpened opened = 5;
    StatsDataClicked clicked = 6;
    StatsDataRejected rejected = 7;
    StatsDataError error = 8;
  }
}

message StatsDataAccepted {}

message StatsDataRejected {
  string reason = 1;
}

message StatsDataDelivered {}

message StatsDataFailed {}

message StatsDataBounced {
  bool permanent = 1;
  uint32 code = 2;
  string msg = 3;
}

message StatsDataError {
  uint32 code = 1;
  string msg = 2;
}

message StatsDataOpened {
  string user_agent = 1;
  string ip = 2;
}

message StatsDataClicked {
  string user_agent = 1;
  string ip = 2;
  string url = 3;
}