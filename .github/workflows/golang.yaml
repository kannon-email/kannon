name: golangci-lint

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: --timeout 5m
      - name: deadcode
        run: |
          out=$(go tool deadcode -test ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "deadcode: unreachable code detected"
            exit 1
          fi
