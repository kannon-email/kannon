name: CI

on:
  push:
    branches:
      - "main"
    # Tag builds always run: GitHub does not evaluate path filters for tags.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: make test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test E2E
        run: make test-e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # Keep in sync with mise.toml.
          args: --timeout 5m
      - name: Check dead code
        run: make deadcode

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, test-e2e, lint]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Vars
        id: get_vars
        run: |
          echo "ts=$(date +%s)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
      - name: Build Kannon
        uses: ./.github/actions/build-docker
        with:
          docker-target: kannon
          branch: ${{ steps.get_vars.outputs.branch }}
          sha: ${{ steps.get_vars.outputs.sha }}
          ts: ${{ steps.get_vars.outputs.ts }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
